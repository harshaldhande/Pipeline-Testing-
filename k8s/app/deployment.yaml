apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-app
  namespace: todo-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app

    spec:
      automountServiceAccountToken: false

      containers:
      - name: todo-app

        image: dockerforlearning0213/todo-app:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "500Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"
            ephemeral-storage: "1Gi"

        env:
        - name: DB_HOST
          value: mysql

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER

        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE
